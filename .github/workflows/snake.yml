name: generate snake

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake animation
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2ea043&color_dots=#2ea043,#f85149,#d29922,#3fb950
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#2ea043&color_dots=#2ea043,#f85149,#d29922,#3fb950

      - name: push to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
          clean: true
